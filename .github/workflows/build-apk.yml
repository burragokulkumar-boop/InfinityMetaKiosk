name: Build InfinityMetaKiosk APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p build_project/app/src/main/java
          mkdir -p build_project/app/src/main/res/values
          mkdir -p build_project/app/src/main/res/xml
          mkdir -p build_project/app/src/main/res/drawable
          mkdir -p build_project/app/src/recovery

          PACKAGE=$(grep -m1 '^package ' MainActivity.java | sed 's/package //;s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Could not find Java package in MainActivity.java"
            exit 1
          fi

          echo "Detected package: $PACKAGE"

          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
          mkdir -p "build_project/app/src/main/java/$PACKAGE_PATH"

          for FILE in MainActivity.java KioskDeviceAdminReceiver.java KioskBootReceiver.java ManagementService.java ManagementCommandReceiver.java ApiClient.java DeviceRegistration.java; do
            if [ -f "$FILE" ]; then
              cp "$FILE" "build_project/app/src/main/java/$PACKAGE_PATH/"
            fi
          done

          cp AndroidManifest.xml \
            build_project/app/src/main/AndroidManifest.xml

          for FILE in colors.xml strings.xml themes.xml; do
            if [ -f "$FILE" ]; then
              cp "$FILE" \
                "build_project/app/src/main/res/values/$FILE"
            fi
          done

          if [ -f device_admin_receiver.xml ]; then
            cp device_admin_receiver.xml \
              build_project/app/src/main/res/xml/device_admin_receiver.xml
          fi

          if [ -f infinity_wallpaper.jpg ]; then
            cp infinity_wallpaper.jpg \
              build_project/app/src/main/res/drawable/infinity_wallpaper.jpg
          fi

          if [ -f recovery/AndroidManifest.xml ]; then
            cp recovery/AndroidManifest.xml \
              build_project/app/src/recovery/AndroidManifest.xml
          fi

          if [ -f infinity_meta_icon.png ]; then
            cp infinity_meta_icon.png \
              build_project/app/src/main/res/drawable/infinity_meta_icon.png
          else
            echo "ERROR: infinity_meta_icon.png was not found in the repository root."
            exit 1
          fi

          cat > build_project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "InfinityMetaKiosk"
          include(":app")
          EOF

          cat > build_project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > build_project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE'
              compileSdk 35

              defaultConfig {
                  applicationId '$PACKAGE'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../infinitymeta-release.jks")
                      storeType "PKCS12"
                      storePassword System.getenv("INFINITYMETA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("INFINITYMETA_KEY_ALIAS")
                      // PKCS12 uses the keystore password for the private key.
                      keyPassword System.getenv("INFINITYMETA_KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }

                  recovery {
                      initWith release
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > build_project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Restore permanent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.INFINITYMETA_KEYSTORE_BASE64 }}
          INFINITYMETA_KEYSTORE_PASSWORD: ${{ secrets.INFINITYMETA_KEYSTORE_PASSWORD }}
          INFINITYMETA_KEY_ALIAS: ${{ secrets.INFINITYMETA_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: INFINITYMETA_KEYSTORE_BASE64 GitHub Secret is not configured."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build_project/infinitymeta-release.jks

          if [ ! -s build_project/infinitymeta-release.jks ]; then
            echo "ERROR: Release keystore is empty."
            exit 1
          fi

          echo "Validating restored PKCS12 keystore..."
          keytool -list -storetype PKCS12 -keystore build_project/infinitymeta-release.jks -storepass "$INFINITYMETA_KEYSTORE_PASSWORD" -alias "$INFINITYMETA_KEY_ALIAS" >/dev/null
          echo "Release keystore validated successfully."

      - name: Build APK
        working-directory: build_project
        env:
          INFINITYMETA_KEYSTORE_PASSWORD: ${{ secrets.INFINITYMETA_KEYSTORE_PASSWORD }}
          INFINITYMETA_KEY_ALIAS: ${{ secrets.INFINITYMETA_KEY_ALIAS }}
          INFINITYMETA_KEY_PASSWORD: ${{ secrets.INFINITYMETA_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$INFINITYMETA_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: INFINITYMETA_KEYSTORE_PASSWORD GitHub Secret is not configured."
            exit 1
          fi

          if [ -z "$INFINITYMETA_KEY_ALIAS" ]; then
            echo "ERROR: INFINITYMETA_KEY_ALIAS GitHub Secret is not configured."
            exit 1
          fi

          gradle :app:assembleRelease :app:assembleRecovery --stacktrace

      - name: Check APK
        run: |
          echo "=== APK files generated ==="
          find build_project/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityMetaKiosk-APK
          path: build_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
